name: Gerar Chave Fixa
on: [workflow_dispatch]
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Criar keystore e converter para Base64
        run: |
          keytool -genkeypair -v -keystore prism.keystore -alias prismkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass prism1234 -keypass prism1234 \
            -dname "CN=Charlen, OU=Dev, O=Prism, L=MontesClaros, ST=MG, C=BR"
          echo "=== COPIE A LINHA ABAIXO ==="
          base64 -w 0 prism.keystore
          echo ""
          echo "=== FIM DA CHAVE ==="
